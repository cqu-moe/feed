name: Prepare isolated Feed and Auth E2E
description: Install pinned dependencies and the selected browser without sharing runtime state.
inputs:
  browser:
    description: Browser to install
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: cqu-moe/auth
        ref: 9cbfed93dcd73b626c6e9d7f0b663ce679c0d1bd
        path: .e2e/auth-checkout
        persist-credentials: false
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          .e2e/auth-checkout/frontend/pnpm-lock.yaml
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: .e2e/auth-checkout/package-lock.json
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: npm --prefix .e2e/auth-checkout ci --prefer-offline
      shell: bash
    - run: pnpm --dir .e2e/auth-checkout/frontend install --frozen-lockfile
      shell: bash
    - run: pnpm exec e2e-web install chromium --with-deps
      if: inputs.browser == 'chromium'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: .e2e/browser-cache
        E2E_TELEMETRY_DISABLED: '1'
        DO_NOT_TRACK: '1'
    - run: pnpm exec playwright install --with-deps "$BROWSER"
      if: inputs.browser != 'chromium'
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        PLAYWRIGHT_BROWSERS_PATH: .e2e/browser-cache
