name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, build, design and Worker packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: PDF telemetry regression with intercepted local endpoint
        run: pnpm test:browser tests/browser/pdf-telemetry.spec.ts
        env:
          VITE_POSTHOG_PROJECT_TOKEN: phc_feed_browser_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e:
    name: Real Auth and Feed ${{ matrix.suite }} E2E (round ${{ matrix.round }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2]
        suite: [reader, ingestion]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cqu-moe/auth
          ref: d9bf0c5e6d5cc459029da6a345991b8d0f13f514
          path: .e2e/auth-checkout
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm --prefix .e2e/auth-checkout ci
      - run: pnpm --dir .e2e/auth-checkout/frontend install --frozen-lockfile
      - run: pnpm exec e2e-web install chromium --with-deps
        env:
          PLAYWRIGHT_BROWSERS_PATH: .e2e/browser-cache
          E2E_TELEMETRY_DISABLED: '1'
          DO_NOT_TRACK: '1'
      - run: pnpm test:e2e
        env:
          FEED_E2E_AUTH_CHECKOUT: .e2e/auth-checkout
          FEED_E2E_SUITE: ${{ matrix.suite == 'ingestion' && 'ingestion' || '' }}
          FEED_E2E_OUTPUT: .e2e/${{ matrix.suite }}-round-${{ matrix.round }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-auth-${{ matrix.suite }}-e2e-round-${{ matrix.round }}
          path: .e2e/${{ matrix.suite }}-round-${{ matrix.round }}/public/
          if-no-files-found: error
          retention-days: 7
