name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  # Keep required checks present on documentation-only PRs.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-slim
    timeout-minutes: 2
    outputs:
      code: ${{ steps.paths.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --no-renames --name-only -z "$BASE...$HEAD" | node scripts/ci-changes.mjs >> "$GITHUB_OUTPUT"
          else
            echo 'code=true' >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: Unit and integration tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test --test-shard=${{ matrix.shard }}/2 tests/*.test.mjs

  package:
    name: Build, design, Worker packaging and browser regression
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:design
      - run: pnpm check:worker
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: PDF telemetry regression with intercepted local endpoint
        run: pnpm test:browser tests/browser/pdf-telemetry.spec.ts
        env:
          VITE_POSTHOG_PROJECT_TOKEN: phc_feed_browser_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  e2e:
    name: Real Auth and Feed ${{ matrix.suite }} E2E (${{ matrix.browser }}, round ${{ matrix.round }})
    needs: changes
    # Expand the matrix even for docs so all six required names exist.
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ${{ needs.changes.outputs.code == 'true' && 'ubuntu-latest' || 'ubuntu-slim' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        round: [1, 2]
        suite: [reader, ingestion, mail]
        browser: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    env:
      FEED_E2E_BROWSER: ${{ matrix.browser }}
      FEED_E2E_CROSS_BROWSER: ${{ matrix.browser != 'chromium' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-e2e
        if: needs.changes.outputs.code == 'true'
        with:
          browser: ${{ matrix.browser }}
      - run: pnpm test:e2e
        if: needs.changes.outputs.code == 'true'
        env:
          FEED_E2E_AUTH_CHECKOUT: .e2e/auth-checkout
          FEED_E2E_SUITE: ${{ matrix.suite }}
          FEED_E2E_OUTPUT: .e2e/${{ matrix.suite }}-round-${{ matrix.round }}
      - uses: actions/upload-artifact@v4
        if: always() && needs.changes.outputs.code == 'true'
        with:
          name: feed-auth-${{ matrix.suite }}-e2e-${{ matrix.browser }}-round-${{ matrix.round }}
          path: .e2e/${{ matrix.suite }}-round-${{ matrix.round }}/public/
          if-no-files-found: error
          retention-days: 7

  mail-controls:
    name: Mail negative controls (${{ matrix.browser }}, ${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        browser: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    env:
      FEED_E2E_BROWSER: ${{ matrix.browser }}
      FEED_E2E_CROSS_BROWSER: ${{ matrix.browser != 'chromium' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-e2e
        with:
          browser: ${{ matrix.browser }}
      - name: Mail gate negative controls
        run: pnpm test:e2e:mail:controls
        env:
          FEED_E2E_AUTH_CHECKOUT: .e2e/auth-checkout
          FEED_E2E_CONTROL_SHARD: ${{ matrix.shard }}/2
          FEED_E2E_CONTROL_OUTPUT: .e2e/mail-controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-mail-negative-controls-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            .e2e/mail-controls/controls.json
            .e2e/mail-controls/*/public/
          if-no-files-found: error
          retention-days: 7

  check:
    # Preserve the required check and make every new shard a required gate.
    name: Tests, build, design and Worker packaging
    needs: [changes, unit, package, e2e, mail-controls]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const needs = JSON.parse(process.env.NEEDS);
          assert.equal(needs.changes.result, 'success');
          const expected = needs.changes.outputs.code === 'false' ? 'skipped' : 'success';
          for (const [job, {result}] of Object.entries(needs)) {
            if (job !== 'changes') assert.equal(result, job === 'e2e' ? 'success' : expected, `${job}: ${result}`);
          }
          JS
